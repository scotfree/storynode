<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryNode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bar">
        <span class="brand">StoryNode</span>
        <nav class="tabs" aria-label="Mode">
            <a href="#map" data-mode="map">Map</a>
            <a href="#read" data-mode="read">Read</a>
            <a href="#voice" data-mode="voice">Voice</a>
        </nav>
        <button id="story-button" class="ghost" title="Story" aria-label="Story">⋯</button>
    </header>

    <!-- Which story: pick one, or make a new one. -->
    <div class="story-bar">
        <label for="story-select">Story</label>
        <select id="story-select"></select>
    </div>

    <main>
        <!-- Map: the whole story's shape, titles only. -->
        <section id="map-view" class="view" hidden>
            <h1 class="story-title" id="map-title"></h1>
            <p class="hint">Click a node to read from there.</p>
            <div class="map-scroll"><svg id="map" role="img" aria-label="Story map"></svg></div>
        </section>

        <!-- Read: one page of the story, choices at the bottom. -->
        <section id="read-view" class="view" hidden>
            <article class="page">
                <h1 id="read-title"></h1>
                <div id="read-text" class="story-text"></div>
                <ol id="read-choices" class="choices"></ol>
                <p id="read-end" class="the-end" hidden></p>
                <button id="read-add" class="add-link" type="button"></button>
                <div class="row">
                    <button id="read-back" class="ghost">Back</button>
                    <button id="read-restart" class="ghost">Start over</button>
                </div>
            </article>
        </section>

        <!-- Voice: one big button. It reads the page and the choices, then listens. -->
        <section id="voice-view" class="view voice" hidden>
            <p id="voice-title" class="voice-title"></p>
            <div id="talk-stage" class="talk-stage">
                <button id="talk" class="talk" aria-live="polite">Hold To Talk</button>
                <p id="voice-mode" class="voice-mode">Hold to Talk</p>
                <button id="mode-knob" class="mode-knob" type="button" aria-label="Switch between Hold to Talk and Hands Free"></button>
                <button id="restart-arc" class="arc-button" type="button" aria-label="Restart the story: drag clockwise">Restart</button>
                <button id="repeat-arc" class="arc-button" type="button" aria-label="Repeat this page: drag counterclockwise">Repeat</button>
                <svg id="arc-guide" class="arc-guide" aria-hidden="true" hidden></svg>
            </div>
            <p id="voice-status" class="voice-status" aria-live="polite"></p>
            <ol id="voice-choices" class="voice-choices"></ol>
            <button id="voice-add" class="add-link" type="button"></button>
            <details class="voice-settings">
                <summary>Voice settings</summary>
                <label>Voice <select id="voice-select"></select></label>
                <label>Speed <input type="range" id="voice-rate" min="0.7" max="1.4" step="0.05" value="1"></label>
                <p id="voice-support" class="hint"></p>
            </details>
            <button id="voice-panel" class="voice-panel" type="button" aria-label="Open the voice log">
                <span id="voice-heard" class="voice-heard" aria-live="polite"></span>
                <span class="voice-panel-hint">Log</span>
            </button>
        </section>
    </main>

    <dialog id="story-dialog">
        <h2 id="dialog-title">Story</h2>
        <p id="story-overview" class="story-overview"></p>
        <p id="story-source" class="hint"></p>
        <label class="file">Add a story from a file <input type="file" id="story-file" accept="application/json,.json"></label>
        <p class="hint">Stories are JSON: nodes with an id, a title, text and a parent. See README.md.</p>
        <p id="story-errors" class="errors" hidden></p>
        <div class="row">
            <button id="story-download" class="ghost">Download this story</button>
            <button id="story-remove" class="ghost" hidden></button>
            <button id="story-close">Close</button>
        </div>
    </dialog>

    <dialog id="add-dialog">
        <form id="add-form" method="dialog" class="add-form">
            <h2 id="add-heading"></h2>
            <p id="add-hint" class="hint"></p>
            <label>Title <input id="add-title" type="text" maxlength="80" required autocomplete="off"></label>
            <label><span id="add-text-label">Text</span> <textarea id="add-text" rows="7" required></textarea></label>
            <p id="add-errors" class="errors" hidden></p>
            <div class="row">
                <button id="add-cancel" class="ghost" type="button">Cancel</button>
                <button type="submit">Submit</button>
            </div>
        </form>
    </dialog>

    <dialog id="log-dialog" class="log-dialog">
        <h2>Voice log</h2>
        <ol id="log-list" class="log-list"></ol>
        <div class="row">
            <button id="log-copy" class="ghost">Copy</button>
            <button id="log-close">Close</button>
        </div>
    </dialog>

    <script type="module" src="src/app.js"></script>
</body>
</html>
